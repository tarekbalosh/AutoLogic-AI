version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: supportflow-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_support_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - supportflow-network

  redis:
    image: redis:7-alpine
    container_name: supportflow-redis
    ports:
      - '6379:6379'
    networks:
      - supportflow-network

networks:
  supportflow-network:
    driver: bridge

volumes:
  pgdata:
